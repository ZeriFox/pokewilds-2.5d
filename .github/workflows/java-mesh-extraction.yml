name: Java mesh extraction checkpoint
on:
  push:
    branches: [refactor/world-mesh-batch]
    paths:
      - '.github/workflows/java-mesh-extraction.yml'
      - '.github/extract_world_mesh.py'
      - 'tools/WorldMeshBatchTest.java'
      - 'tools/WorldRendererParityTest.java'
      - 'tools/world_mesh_batch_test.py'
      - 'src/com/pkmngen/game/WorldMeshBatch.java'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: java-mesh-extraction
  cancel-in-progress: false
jobs:
  extract-and-verify:
    if: github.ref == 'refs/heads/refactor/world-mesh-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply the checksum-guarded extraction and commit actual sources locally
        run: |
          test "$(git ls-remote origin refs/heads/refactor/world-mesh-batch | cut -f1)" = "$GITHUB_SHA"
          python .github/extract_world_mesh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/com/pkmngen/game/JohtoRenderer.java baseline/java-mesh-step1 baseline/modernization-scope.json tools/verify_visual_scope.py tools/verify_rework.py tools/WorldMeshBatchTest.java docs/JAVA-REFACTOR-STEP1.md
          git add -u .github
          git diff --cached --check
          git commit -m 'Extract world mesh ownership from JohtoRenderer without changing scene rendering'
          git show --stat --oneline HEAD
      - name: Restore verified Java build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-build-inputs.zip --dir "$RUNNER_TEMP"
          echo "5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f  $RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" -d .
      - name: Preserve assets and build the complete game with the existing audit
        run: |
          python -m pip install Pillow==11.3.0
          python tools/verify_rework.py --stage prepare
          python tools/verify_rework.py --stage build
      - name: Install real software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Run GPU ownership and original-versus-refactored scene comparisons
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tools/world_mesh_batch_test.py
      - name: Publish only this verified source checkpoint without force-push
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refactor/world-mesh-batch
          echo "Verified checkpoint: $(git rev-parse HEAD)"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java-mesh-extraction-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/rework-verification/
            build/build-report.json
            build/visual-scope.json
            build/world-mesh-batch/*.log
            build/world-mesh-batch/*.png
