name: Java mesh final regression
on:
  push:
    branches: [refactor/world-mesh-batch]
    paths: ['.github/workflows/mesh-test-adapters.yml']
permissions:
  contents: write
concurrency:
  group: mesh-step1-final
  cancel-in-progress: false
jobs:
  verified-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Adapt only the reviewed reflective test lookups and commit the exact test checkpoint
        run: |
          test "$(git ls-remote origin refs/heads/refactor/world-mesh-batch | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          changes = [
              ('tools/BiomeSceneTest.java','2cb1b3529c42c3b00991bd528c41377bbd30d1f4','a1115795f7af9535b19bd90268017c99d3026537',[
                  ('            Map<?,?> groups=(Map<?,?>)groupsField.get(renderer());',
                   '            WorldMeshBatch owner=(WorldMeshBatch)groupsField.get(renderer());\n            Field buffers=WorldMeshBatch.class.getDeclaredField("groups");buffers.setAccessible(true);\n            Map<?,?> groups=(Map<?,?>)buffers.get(owner);')]),
              ('tools/FieldSceneTest.java','66b0ff979ce594df27f55a641732fdc0fbd2f358','0e516aaea5238a82a6a5dc0d65e7be0782c8099f',[
                  ('         @SuppressWarnings("unchecked") Map<Texture,Object> groups=(Map<Texture,Object>)field(renderer(),"geometry");',
                   '         WorldMeshBatch owner=(WorldMeshBatch)field(renderer(),"geometry");\n         @SuppressWarnings("unchecked") Map<Texture,Object> groups=(Map<Texture,Object>)field(owner,"groups");')]),
              ('tools/ReliefVisualTest.java','3eedb67fdf631fc42bd90935d3929fed30582d43','b5e1dba8f6ee0749c091148ff450189ab1f92d0b',[
                  ('            for(Object mesh:((Map<?,?>)groups.get(renderer())).values()) {',
                   '            WorldMeshBatch owner=(WorldMeshBatch)groups.get(renderer());\n            Field buffers=WorldMeshBatch.class.getDeclaredField("groups");buffers.setAccessible(true);\n            for(Object mesh:((Map<?,?>)buffers.get(owner)).values()) {'),
                  ('            for(Object mesh:((Map<?,?>)groupsField.get(renderer())).values()) {',
                   '            WorldMeshBatch owner=(WorldMeshBatch)groupsField.get(renderer());\n            Field buffers=WorldMeshBatch.class.getDeclaredField("groups");buffers.setAccessible(true);\n            for(Object mesh:((Map<?,?>)buffers.get(owner)).values()) {')])]
          for name,before,after,replacements in changes:
              path=Path(name);raw=path.read_bytes()
              if blob(raw)!=before: raise RuntimeError('Test changed since inspection: '+name)
              text=raw.decode('utf-8')
              for old,new in replacements:
                  if text.count(old)!=1: raise RuntimeError('Ambiguous inspection path in '+name)
                  text=text.replace(old,new,1)
              encoded=text.encode('utf-8')
              if blob(encoded)!=after: raise RuntimeError('Unexpected test adapter delta: '+name)
              path.write_bytes(encoded)
          # The normal tracked build must not retain a source-editing workflow.
          Path('.github/workflows/mesh-test-adapters.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/BiomeSceneTest.java tools/FieldSceneTest.java tools/ReliefVisualTest.java
          git add -u .github/workflows/mesh-test-adapters.yml
          git diff --cached --check
          git diff --cached -- tools
          git commit -m 'Adapt biome, field and relief test introspection without changing any assertions'
      - name: Restore pinned Java inputs and test environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-build-inputs.zip --dir "$RUNNER_TEMP"
          echo "5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f  $RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" -d .
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Full deterministic preparation, audited Java build and all 23 native runners
        run: xvfb-run -a -s '-screen 0 2560x1440x24' python tools/verify_rework.py --stage all
      - name: Compile the retained saved-relief diagnostic against the built game
        run: |
          mkdir -p build/relief-compile
          javac --release 17 -encoding UTF-8 -proc:none -cp dist/pokewilds-rebuilt.jar -d build/relief-compile tools/ReliefVisualTest.java
      - name: Push only the fully verified clean checkpoint
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          report=json.loads(Path('build/rework-verification/native.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if report['status']!='passed' or report['commit']!=head or len(report['checks'])!=23:
              raise RuntimeError('Incomplete or stale full native acceptance')
          print('Verified commit:',head)
          print('JAR SHA256:',report['jar_sha256'])
          print('Native runner groups:',len(report['checks']))
          PY
          git push origin HEAD:refactor/world-mesh-batch
      - name: Preserve exact code delta, logs and screenshots even on failure
        if: always()
        run: |
          mkdir -p build/mesh-step1
          git show --format=fuller HEAD > build/mesh-step1/test-adapter-commit.patch
          find build -name '*.log' -maxdepth 4 -print
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mesh-step1-full-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/mesh-step1/
            build/rework-verification/
            build/build-report.json
            build/visual-scope.json
            build/*/*.log
            build/*/*.png
            build/move-effects/**/*.png
