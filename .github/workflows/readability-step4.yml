name: Terrain readability and encounter polish
on:
  push:
    branches: [fix/terrain-readability-step4]
    paths: ['.github/workflows/readability-step4.yml', '.github/apply_readability_step4.py', 'src/com/pkmngen/game/WorldReadability.java', 'tools/WorldReadabilityTest.java', 'tools/world_readability_test.py', 'tools/test_readability_assets.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: readability-step4
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply reviewed presentation changes and preserve the preceding audit
        id: source
        run: |
          test "$(git ls-remote origin refs/heads/fix/terrain-readability-step4 | cut -f1)" = "$GITHUB_SHA"
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/apply_readability_step4.py')
          text=p.read_text()
          needle="# Extend both archive enumeration call sites, retaining every preceding digest."
          assert text.count(needle)==1
          text=text.replace(needle,needle+"\nvs=replace(vs,'for archived, expected in STEP3_ARCHIVE.items():','for archived, expected in (STEP3_ARCHIVE | STEP4_ARCHIVE).items():')")
          p.write_text(text)
          PY
          python .github/apply_readability_step4.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/verify_rework.py');s=p.read_text()
          assert s.count('    "tools/test_packaging.py",')==1
          s=s.replace('    "tools/test_packaging.py",','    "tools/test_packaging.py",\n    "tools/test_readability_assets.py",')
          assert s.count('    ["tools/desktop_menu_flow_test.py"],')==1
          s=s.replace('    ["tools/desktop_menu_flow_test.py"],','    ["tools/desktop_menu_flow_test.py"],\n    ["tools/world_readability_test.py"],')
          p.write_text(s)
          # Metadata lookup adaptation only. Keep the existing bed/pillow/seat
          # geometry assertions; style 4 now means foot-plane depth, not "actor".
          p=Path('tools/FieldSceneTest.java');s=p.read_text()
          old='float[] data=vertices.items;boolean isActor=data[offset+6]>3.5f;\n            if(isActor!=actor)continue;'
          new='float[] data=vertices.items;boolean footPlane=data[offset+6]>3.5f;\n            if(footPlane!=(actor || WorldReadability.enabled()))continue;'
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          doc='''# Java step 4 - terrain readability and encounter polish

          Base: ac526d14. Java/LibGDX and Python only.
          Presentation scope: derived 64px lawn/path materials across 4x4 cells;
          natural dry boundary feathering; visible tread/shadow pairs on actual
          slopes (including implicit ramps); shared vertical prop/actor depth;
          cached complete PMD Idle/Walk envelopes for stable scale and dry feet;
          shared slate/teal UI palette and eased full-viewport encounter bands.

          Original sheet PNGs, PMD images, player identities, controls, collision,
          terrain-height solver, map generation, battle rules and saves are unchanged.
          A foreground tree may legitimately obscure a Pokemon: the change is a
          consistent depth convention, not removal of trees or collision bypass.
          Classic trainers are not silently replaced or advertised as newly drawn HD art.
          Additional authored detailed trainers are not included in this checkpoint.

          The palette treatment is a derived asset transformation with recorded
          provenance, not a screen overlay or replacement of the original sources.
          Water, lava, cliffs, authored ramps, structures and puzzle boundaries do
          not receive feathered edges. Existing terrain errors are not hidden by fog.
          Entering battle keeps original action duration, dispatch and sounds.
          Reduced Motion replaces moving entrance bands with a restrained static
          card/fade; no strobing, global bloom or camera shake is introduced.

          Tests: test_readability_assets.py (opaque periodic surfaces and source hashes),
          world_readability_test.py (built-JAR GL scenes, seam eligibility, ramps,
          PMD envelopes, depth convention, RNG/tile invariance and intro progression).
          Historical mesh parity explicitly sets readability=off: it checks unchanged
          mesh/geometry behavior, not equivalence of the new terrain/depth treatment.
          New behavior is tested ON separately; all existing assertions are retained.
          FieldSceneTest locates furniture with the new foot-depth style, then runs
          the same submitted bed/pillow/seated actor geometry assertions as before.

          Receipts, not this document, determine whether tests and packaging passed.
          No manual full-world or multiplayer playthrough is implied by fixtures.
          This checkpoint does not promise every saved-island stair or source-art defect
          is corrected. Verify problematic saved positions using the user's save next.
          '''
          Path('docs/JAVA-REFACTOR-STEP4.md').write_text(doc)
          p=Path('docs/REWORK-STATUS.md');p.write_text('# Readability checkpoint (step 4)\n\nSee JAVA-REFACTOR-STEP4.md. Acceptance is recorded in build/native/package receipts.\n\n'+p.read_text())
          p=Path('tools/package_windows.py');s=p.read_text();s=s.replace('"JAVA-REFACTOR-STEP3.md"):', '"JAVA-REFACTOR-STEP3.md", "JAVA-REFACTOR-STEP4.md"):');p.write_text(s)
          PY
          python -m py_compile tools/world_readability_test.py tools/test_readability_assets.py tools/prepare_stardew_presentation.py
          python tools/verify_visual_scope.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/com/pkmngen/game/JohtoRenderer.java src/com/pkmngen/game/PmdPokemonSprites.java src/com/pkmngen/game/ModernUi.java src/com/pkmngen/game/JohtoBattleRenderer.java baseline/java-readability-step4 baseline/modernization-scope.json tools/verify_visual_scope.py tools/verify_scope_test.py tools/verify_rework.py tools/world_mesh_batch_test.py tools/prepare_stardew_presentation.py tools/package_windows.py tools/FieldSceneTest.java resources/visual/stardew docs/JAVA-REFACTOR-STEP4.md docs/REWORK-STATUS.md
          git add -u .github
          git diff --cached --check
          git commit -m 'Clarify terrain, ramps and actor depth; polish encounter presentation'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff ac526d14df8409fa365e65bedf8758784ddc2d68 --stat
      - name: Restore verified build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-build-inputs.zip --dir "$RUNNER_TEMP"
          echo "5692696180a62dc1c8822e2a2d2a2... (truncated)" >/dev/null
          echo "5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f  $RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" -d .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Compile and verify every original suite plus readability
        run: |
          python tools/verify_rework.py --stage prepare
          python tools/verify_rework.py --stage build
          xvfb-run -a -s '-screen 0 2560x1440x24' python tools/world_readability_test.py
          xvfb-run -a -s '-screen 0 2560x1440x24' python tools/verify_rework.py --stage native
          python - <<'PY'
          from pathlib import Path
          import json
          for p in sorted(Path('build/rework-verification').glob('*.json')):
              d=json.loads(p.read_text());print(p.name,d.get('status'),d.get('commit'),len(d.get('checks',[])),d.get('jar_sha256'))
          PY
      - name: Publish the verified source checkpoint without force push
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:fix/terrain-readability-step4
      - name: Restore pinned portable Windows Java and package the exact verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38179356847 --repo ZeriFox/pokewilds-2.5d --name ui-step3-playable --dir "$RUNNER_TEMP/old-player"
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,os,zipfile,shutil
          p=Path(os.environ['RUNNER_TEMP'])/'old-player/pokewilds-2.5d-windows-x64-v0.8.11-interface.1.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2605773ccf85b153c64433f22bdf11a49f673432dc98778c758e8aa2a0de3d62'
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.startswith('PokeWilds-2.5D/toolchain/jdk-17/'):
                      assert '..' not in PurePosixPath(n).parts and '\\' not in n
                      t=Path(n.removeprefix('PokeWilds-2.5D/'));t.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(n) as src,t.open('wb') as dst:shutil.copyfileobj(src,dst)
          PY
          python tools/package_windows.py --version v0.8.11-readability.1 --output build/release --verification build/rework-verification/native.json --verification build/rework-verification/build.json
      - name: Retain compiled candidate for Windows verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readability-compiled-candidate
          path: build/release/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Preserve evidence on success or failure
        if: always()
        run: |
          mkdir -p build/readability-checkpoint
          git diff ac526d14df8409fa365e65bedf8758784ddc2d68 > build/readability-checkpoint/review.patch
          for p in build/*/*.log; do if grep -qE 'Exception|FAIL|error:' "$p"; then echo "==== $p"; tail -50 "$p"; fi; done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readability-step4-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rework-verification/
            build/readability-checkpoint/
            build/build-report.json
            build/*/*.log
            build/*/*.png
            build/move-effects/**/*.png
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download candidate and pinned test-only OpenGL driver
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo ZeriFox/pokewilds-2.5d --name readability-compiled-candidate --dir build/portable
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          New-Item -ItemType Directory -Force build/mesa | Out-Null
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile build/mesa.7z
          if ((Get-FileHash build/mesa.7z -Algorithm SHA256).Hash.ToLower() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'Mesa archive digest mismatch' }
          7z x build/mesa.7z -obuild/mesa -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
      - name: Test actual launcher and new rendering fixtures on Windows
        shell: python
        run: |
          import json,os,shutil,subprocess,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path('tools').resolve()))
          import verify_windows_package as verifier
          output=Path('build/windows-readability').resolve();output.mkdir(parents=True,exist_ok=True)
          archive=Path('build/portable/pokewilds-2.5d-windows-x64-v0.8.11-readability.1.zip').resolve()
          drivers=[p.parent for p in Path('build/mesa').resolve().rglob('opengl32.dll') if p.parent.name.lower()=='x64']
          assert len(drivers)==1
          original=verifier.run_owned_launcher
          def launch(game,environment,log_path):
              runtime=game/'toolchain/jdk-17'
              for source in drivers[0].glob('*.dll'):
                  target=runtime/'bin'/source.name
                  assert not target.exists(), 'Refuse packaged DLL replacement'
                  shutil.copy2(source,target)
              result=original(game,environment,log_path)
              work=output/'world-readability';classes=work/'classes';classes.mkdir(parents=True)
              jar=game/'dist/pokewilds-rebuilt.jar';env=dict(environment);env.pop('JAVA_TOOL_OPTIONS',None)
              commands=[
                  [str(runtime/'bin/javac.exe'),'--release','17','-encoding','UTF-8','-proc:none','-cp',str(jar),'-d',str(classes),str(Path('tools/WorldReadabilityTest.java').resolve())],
                  [str(runtime/'bin/java.exe'),'-Xmx2g','-Dfile.encoding=UTF-8','-Dpokewilds.visual=johto','-Dpokewilds.models=off','-cp',str(classes)+os.pathsep+str(jar),'com.pkmngen.game.WorldReadabilityTest']]
              with (work/'readability-windows.log').open('w',encoding='utf-8') as log:
                  for command in commands:
                      log.flush();r=subprocess.run(command,cwd=work,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=180,creationflags=subprocess.CREATE_NO_WINDOW)
                      if r.returncode: raise RuntimeError('Windows readability failed')
              text=(work/'readability-windows.log').read_text(encoding='utf-8',errors='replace')
              assert 'READABILITY PASS:' in text and 'llvmpipe' in text
              print(text);return result
          verifier.run_owned_launcher=launch
          try:
              verifier.verify(archive,output)
              receipt=json.loads((output/'windows-package-verification.json').read_text());assert receipt['status']=='passed'
              ready=Path('build/download');ready.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as z:z.extractall(ready)
              (output/'test-environment.txt').write_text('Windows Server; Mesa 26.2.4 llvmpipe in temporary test extraction only. Candidate ZIP unchanged; driver not delivered. Automated fixtures, not a manual campaign.\n')
          finally:
              for p in output.rglob('*.log'):
                  print('==== '+str(p));print(p.read_text(encoding='utf-8',errors='replace')[-9000:])
      - name: User-ready compiled game - one ZIP extraction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PokeWilds-Windows-readability-4
          path: build/download/
          retention-days: 14
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readability-windows-evidence-${{ github.run_id }}
          path: |
            build/windows-readability/*.json
            build/windows-readability/*.txt
            build/windows-readability/*.png
            build/windows-readability/*.log
            build/windows-readability/world-readability/*.log
            build/windows-readability/world-readability/*.png
          retention-days: 14
          if-no-files-found: warn
