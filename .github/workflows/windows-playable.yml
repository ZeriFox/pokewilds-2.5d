name: Windows playable release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-playable.yml'

permissions:
  contents: read

concurrency:
  group: windows-playable-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.8.11-johto.3
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Choose a new version instead of replacing it.'
            exit 1
          fi
      - name: Restore verified compilation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo "$GITHUB_REPOSITORY" --pattern pokewilds-2.5d-build-inputs.zip --dir "$RUNNER_TEMP"
          echo "5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f  $RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" -d .
      - name: Unit regressions and complete compilation
        run: |
          python tools/test_flexible_sampling.py
          python tools/test_visual_geometry.py
          python build.py
      - name: Install software OpenGL display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Test the exact rebuilt game
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python tools/landscape_smoke_test.py || { cat build/landscape-smoke/landscape-smoke.log; exit 1; }
          xvfb-run -a -s '-screen 0 1024x768x24' python tools/pmd_battle_visual_test.py
      - name: Retrieve the already distributed Windows Java runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo "$GITHUB_REPOSITORY" --pattern pokewilds-2.5d-windows-x64.zip --dir "$RUNNER_TEMP"
          echo "7f21bb752c6eb5766a2a5f842cf6291e35123cb667ed588e553fda6d25133ae5  $RUNNER_TEMP/pokewilds-2.5d-windows-x64.zip" | sha256sum -c -
      - name: Assemble a clean portable Windows package
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import struct
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          out = root / 'release-output'
          out.mkdir(exist_ok=True)
          package = Path(os.environ['RUNNER_TEMP']) / 'playable' / 'PokeWilds-2.5D'
          package.mkdir(parents=True, exist_ok=False)
          previous = Path(os.environ['RUNNER_TEMP']) / 'pokewilds-2.5d-windows-x64.zip'
          runtime = package / 'toolchain' / 'jdk-17'

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          # Copy only the verified portable runtime, not the old game or any saves.
          with zipfile.ZipFile(previous) as archive:
              candidates = [n for n in archive.namelist() if n.endswith('toolchain/jdk-17/bin/java.exe')]
              if len(candidates) != 1:
                  raise RuntimeError('Expected exactly one portable Windows Java runtime')
              prefix = candidates[0][:-len('bin/java.exe')]
              for info in archive.infolist():
                  if not info.filename.startswith(prefix) or info.is_dir():
                      continue
                  relative = PurePosixPath(info.filename[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts or '\\' in str(relative):
                      raise RuntimeError('Unsafe runtime archive path')
                  destination = runtime.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as src, destination.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
          for required in ('bin/java.exe', 'bin/server/jvm.dll', 'lib/modules', 'release'):
              if not (runtime / required).is_file():
                  raise RuntimeError('Incomplete portable runtime: ' + required)
          java_header = (runtime / 'bin/java.exe').read_bytes()
          pe_offset = struct.unpack_from('<I', java_header, 0x3c)[0]
          if java_header[:2] != b'MZ' or java_header[pe_offset:pe_offset+4] != b'PE\0\0':
              raise RuntimeError('java.exe is not a Windows executable')
          if struct.unpack_from('<H', java_header, pe_offset + 4)[0] != 0x8664:
              raise RuntimeError('Portable Java must be Windows x64')
          runtime_release = (runtime / 'release').read_text(encoding='utf-8')
          if 'JAVA_VERSION="17.' not in runtime_release:
              raise RuntimeError('Expected Java 17 in portable runtime')

          (package / 'dist').mkdir()
          jar = root / 'dist' / 'pokewilds-rebuilt.jar'
          with zipfile.ZipFile(jar) as archive:
              names = set(archive.namelist())
              for required in ('com/pkmngen/game/desktop/DesktopLauncher.class',
                               'com/pkmngen/game/BwAssets.class',
                               'com/pkmngen/game/JohtoRenderer.class',
                               'com/pkmngen/game/PmdBattleSprites.class',
                               'com/pkmngen/game/VisualSampling.class',
                               'visual/unova/world-atlas.png', 'visual/pmd/catalog.json'):
                  if required not in names:
                      raise RuntimeError('Incomplete playable JAR: ' + required)
              if not any(n.lower().endswith('.dll') for n in names):
                  raise RuntimeError('Windows native libraries are missing from the JAR')
              if archive.testzip() is not None:
                  raise RuntimeError('JAR CRC verification failed')
          shutil.copy2(jar, package / 'dist' / jar.name)
          for name in ('run.cmd', 'run-johto.cmd', 'run-johto-sprites.cmd'):
              with (package / name).open('w', encoding='utf-8', newline='\r\n') as handle:
                  handle.write((root / name).read_text(encoding='utf-8'))
          with (package / 'GIOCA.cmd').open('w', encoding='ascii', newline='\r\n') as handle:
              handle.write('@echo off\ncall "%~dp0run-johto.cmd" %*\nexit /b %errorlevel%\n')
          shutil.copytree(root / 'licenses', package / 'licenses')
          docs = package / 'documentazione'
          docs.mkdir()
          for name in ('GRAFICA-25D.txt', 'POKEDEX-ESPANSO.txt', 'GENERAZIONE-MODERNA.txt',
                       'PROVENANCE.json', 'PMD-PROVENANCE.json'):
              source = root / name
              if source.is_file():
                  shutil.copy2(source, docs / name)
          for name in ('FLEXIBLE-TEXTURES.md', 'VISUAL-FIXES-2026-10-06.md'):
              source = root / 'docs' / name
              if source.is_file():
                  shutil.copy2(source, docs / name)
          for name in ('CREDITS.txt', 'PROVENANCE.json'):
              source = root / 'resources' / 'visual' / 'unova' / name
              shutil.copy2(source, docs / ('UNOVA-' + name))
          shutil.copy2(root / 'build' / 'build-report.json', docs / 'build-report.json')

          commit = os.environ['GITHUB_SHA']
          jar_hash = digest(jar)
          info = {
              'version': os.environ['RELEASE_TAG'], 'commit': commit,
              'jar_sha256': jar_hash, 'platform': 'Windows x64',
              'java_runtime_source': 'verified v0.8.11-johto.2 portable runtime',
              'java_release': runtime_release,
              'verification': ['sampling unit regressions', 'visual geometry unit regressions',
                               'full Java 17 compilation', 'native landscape test under Linux Mesa',
                               'native battle test under Linux Mesa', 'JAR CRC and Windows PE x64 checks'],
              'limitations': 'No manual Windows playthrough of this new package was performed.'
          }
          (package / 'VERSIONE.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')
          readme = '''POKEWILDS 2.5D - WINDOWS X64 - JOHTO.3

          AVVIO
          1. Estrai TUTTO lo ZIP in una cartella, ad esempio sul Desktop.
          2. Apri GIOCA.cmd (oppure run-johto.cmd).
          Non serve installare Java, Python o Git. Non serve compilare nulla.
          Non avviare il gioco direttamente dall'interno dello ZIP.

          COMANDI
          Frecce: movimento. Z: conferma. X: indietro/corsa.
          Invio: menu Start. F11: schermo intero.

          SALVATAGGI
          Il gioco crea la cartella run-johto al primo avvio.
          Per continuare una partita precedente, chiudi il gioco e copia la vecchia
          cartella run-johto accanto a GIOCA.cmd, dopo averne fatto una copia di sicurezza.
          Non sovrascrivere salvataggi nuovi senza prima conservarne una copia.
          Questo pacchetto non include partite personali.

          CORREZIONI INCLUSE
          Campionamento texture indipendente dai 16x16 pixel.
          Proporzioni degli oggetti alti e riconoscimento degli arredi corretti.
          Texture e angoli dei dirupi corretti.
          Pose diagonali PMD: i Pokemon in battaglia si rivolgono all'avversario.
          Collisioni, griglia logica e formato dei salvataggi non sono stati cambiati.

          NOTE
          Questa e una versione sperimentale PC Windows x64.
          La build e i test nativi paesaggio/battaglia sono stati eseguiti su Linux/Mesa.
          Il runtime Windows incluso e quello verificato della precedente release.
          Non e stata eseguita una prova manuale completa di questa nuova build su Windows.
          In caso di errore, conserva il testo della finestra del launcher.
          Crediti, provenienza e licenze originali: licenses e documentazione.
          '''
          # Remove indentation used to keep this workflow readable.
          import textwrap
          (package / 'LEGGIMI.txt').write_text(textwrap.dedent(readme), encoding='utf-8')
          filename = 'pokewilds-2.5d-windows-x64-johto.3.zip'
          target = out / filename
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(package.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(package.parent).as_posix())
          with zipfile.ZipFile(target) as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('Portable ZIP CRC verification failed')
              if any('/run-johto/' in name or '/run/' in name for name in archive.namelist()):
                  raise RuntimeError('The portable archive must not include saved games')
          zip_hash = digest(target)
          (out / 'SHA256SUMS.txt').write_text(zip_hash + '  ' + filename + '\n', encoding='ascii')
          (out / 'BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')
          notes = f'''## Pacchetto Windows giocabile con le correzioni visive

          Scarica **{filename}**, estrai tutto e apri **GIOCA.cmd**.
          **Java 17 per Windows x64 e incluso. Non serve compilare o installare Java.**

          Include il campionamento flessibile e le correzioni su `main`: proporzioni degli sprite,
          montagne/dirupi, riconoscimento degli arredi e direzioni dei Pokemon in battaglia.
          I salvataggi sono in `run-johto/`; per continuare una vecchia partita, copia quella
          cartella nella nuova installazione dopo averne fatto un backup.

          Build del commit `{commit}`. SHA-256 del JAR: `{jar_hash}`.
          Superati i test di campionamento e geometria, la compilazione Java 17 e i test nativi
          di paesaggio e battaglia su Linux/Mesa. Runtime Windows x64 verificato dalla release johto.2.
          Non e stata eseguita una sessione manuale completa di questa nuova build su Windows.

          La release e sperimentale e conserva i crediti e le licenze dei materiali originali.
          '''
          (out / 'RELEASE-NOTES.md').write_text(textwrap.dedent(notes), encoding='utf-8')
          print(json.dumps({'package': filename, 'bytes': target.stat().st_size,
                            'sha256': zip_hash, 'jar_sha256': jar_hash, 'commit': commit}, indent=2))
          PY
      - name: Publish the verified playable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-output/pokewilds-2.5d-windows-x64-johto.3.zip \
            release-output/SHA256SUMS.txt release-output/BUILD-INFO.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'PokeWilds 2.5D - correzioni visive e texture flessibili' \
            --notes-file release-output/RELEASE-NOTES.md --prerelease --latest=false
      - name: Preserve verification logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playable-verification-${{ github.sha }}
          path: |
            build/build-report.json
            build/landscape-smoke/*.log
            build/landscape-smoke/*.png
            build/pmd-battle-visual/*.log
            build/pmd-battle-visual/*.png
            release-output/BUILD-INFO.json
            release-output/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: warn
