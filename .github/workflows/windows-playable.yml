name: Windows playable package verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example v0.8.11-johto.4; does not create a tag or public release'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-playable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore pinned libraries and portable Windows runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-build-inputs.zip --pattern pokewilds-2.5d-windows-x64.zip --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Build input download failed' }
          $inputsZip = Join-Path $env:RUNNER_TEMP 'pokewilds-2.5d-build-inputs.zip'
          $runtimeZip = Join-Path $env:RUNNER_TEMP 'pokewilds-2.5d-windows-x64.zip'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $inputsZip).Hash.ToLowerInvariant() -ne '5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f') { throw 'Build inputs SHA256 mismatch' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $runtimeZip).Hash.ToLowerInvariant() -ne '7f21bb752c6eb5766a2a5f842cf6291e35123cb667ed588e553fda6d25133ae5') { throw 'Windows runtime source SHA256 mismatch' }
          @'
          import os, shutil, zipfile
          from pathlib import Path, PurePosixPath
          temporary = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(temporary / 'pokewilds-2.5d-build-inputs.zip') as archive:
              expected = {'lib/upstream-runtime.jar', 'lib/gltf-2.1.0.jar'}
              if set(archive.namelist()) != expected or archive.testzip():
                  raise RuntimeError('Unexpected build-input archive contents')
              for name in sorted(expected):
                  path = Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(name) as source, path.open('wb') as destination:
                      shutil.copyfileobj(source, destination)
          with zipfile.ZipFile(temporary / 'pokewilds-2.5d-windows-x64.zip') as archive:
              prefix = 'pokewilds-2.5d/toolchain/jdk-17/'
              for member in archive.infolist():
                  if not member.filename.startswith(prefix) or member.is_dir():
                      continue
                  relative = PurePosixPath(member.filename[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts or '\\' in str(relative) or ':' in str(relative):
                      raise RuntimeError('Unsafe runtime archive entry')
                  path = Path('toolchain/jdk-17').joinpath(*relative.parts)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(member) as source, path.open('wb') as destination:
                      shutil.copyfileobj(source, destination)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified input extraction failed' }
      - name: Verify tracked assets, complete build and exact-JAR native fixtures
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python tools/verify_rework.py
          if ($LASTEXITCODE -ne 0) { throw 'Source/build/native verification failed; no package is approved' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Verification modified tracked files' }
      - name: Assemble candidate and test the extracted Windows payload
        shell: pwsh
        run: |
          python tools/package_windows.py --version "$env:CANDIDATE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $candidateZip = Join-Path 'build/release' "pokewilds-2.5d-windows-x64-$env:CANDIDATE_VERSION.zip"
          python tools/verify_windows_package.py "$candidateZip"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows startup failed' }
      # Reference-art redistribution is unresolved. Do not upload the playable
      # ZIP, create a release/tag or grant contents:write here.
      - name: Retain verification evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/rework-verification/
            build/windows-package-verification/*.json
            build/windows-package-verification/*.log
            build/windows-package-verification/*.png
            build/release/BUILD-INFO.json
            build/release/SHA256SUMS.txt
            build/*/*.log
            build/*/*.png
