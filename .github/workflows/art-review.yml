name: Art review inputs
on:
  push:
    branches: [feature/stardew-world-frlg-ui]
    paths:
      - tools/art_review.py
      - .github/workflows/art-review.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/art_review.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/art-review/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate review-only source-sheet previews and atlas audit'
            git push origin HEAD:feature/stardew-world-frlg-ui
          fi
