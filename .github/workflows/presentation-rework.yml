name: Presentation rework verification

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**', feature/stardew-world-battle]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'art-source/**'
      - 'baseline/**'
      - 'tools/**'
      - 'build.py'
      - '.github/workflows/presentation-rework.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'art-source/**'
      - 'baseline/**'
      - 'tools/**'
      - 'build.py'
      - '.github/workflows/presentation-rework.yml'

permissions:
  contents: read

concurrency:
  group: presentation-rework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify deterministic asset preparation from tracked inputs
        run: |
          python -m pip install Pillow==11.3.0
          python tools/verify_rework.py --stage prepare
          git diff --exit-code
      - name: Restore verified build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-build-inputs.zip --dir "$RUNNER_TEMP"
          echo "5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f  $RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" -d .
      - name: Check sources and build complete game without migrations
        run: python tools/verify_rework.py --stage build
      - name: Install software OpenGL display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Verify exact built JAR in native fixtures
        run: xvfb-run -a -s '-screen 0 2560x1440x24' python tools/verify_rework.py --stage native
      - name: Confirm sources were not rewritten
        run: git diff --exit-code
      - name: Preserve measured test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: presentation-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/rework-verification/
            build/build-report.json
            build/visual-scope.json
            build/*/*.log
            build/*/*.png
