name: Desktop interface step 3 verified candidate

on:
  push:
    branches: [feat/desktop-interface-step3]
    paths: ['.github/ui-step3.part*', '.github/workflows/ui-step3-checkpoint.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-interface-step3-checkpoint
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/feat/desktop-interface-step3'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    outputs:
      checkpoint: ${{ steps.source.outputs.checkpoint }}
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct only the exact locally reviewed source tree
        id: source
        run: |
          test "$(git ls-remote origin refs/heads/feat/desktop-interface-step3 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path, PurePosixPath
          base = '500a9c9c6bf14bf1b407a476b44ea2f6cc562365'
          tree = 'f9b113e0c08979a89f28ea10d177c48d47dc6dfe'
          git = lambda *a: subprocess.check_output(['git', *a])
          blob = lambda b: hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          sha = lambda b: hashlib.sha256(b).hexdigest()
          transport = ['.github/ui-step3.part'+str(i) for i in range(6)]
          workflow = '.github/workflows/ui-step3-checkpoint.yml'
          if set(git('diff','--name-only',base,'HEAD').decode().splitlines()) != set(transport+[workflow]):
              raise RuntimeError('Unexpected changes before the reviewed source transfer')
          out=Path('build/transport-inputs'); out.mkdir(parents=True,exist_ok=True)
          parts=[]
          expected=['738f5bf937e6829c072f45f13723d9dae710d329','bde9186c8d0f7e7a595c2a43f762b22829a31e4d','49d1cd37f18c6c2eb09da5a8a7e74192d4163e20','29e8ce5b14b2bb0252bd3fc88d8f670579195d47','bbdcaf53d3122723a640dd3256c5e317d2586cb2','b1818ff2204e2e690e02f22c491f234dc5d69195']
          for i,name in enumerate(transport):
              b=Path(name).read_bytes(); (out/Path(name).name).write_bytes(b)
              # Repair two independently reproduced transcription errors only.
              # The expected complete blob and bundle hashes remain mandatory.
              if i==0:
                  if blob(b)!='da88348f217e3a235157df4684be090f502d9fd8' or b[919]!=206:
                      raise RuntimeError('Unexpected part zero input')
                  data=bytearray(b); data[919]=197; b=bytes(data)
              if i==1:
                  if blob(b)!='4cfd503dd242d406e54ce66c4aaa68f518e8cd8f':
                      raise RuntimeError('Unexpected part one input')
                  text=base64.b64encode(b).decode().rstrip('=')
                  old='zt1wniMGWe7444LOWpx'; new='zt1wniMGWdsgtukLOWpx'
                  if text.count(old)!=1: raise RuntimeError('Unexpected part one repair anchor')
                  b=base64.b64decode(text.replace(old,new,1),validate=True)
              if blob(b)!=expected[i]: raise RuntimeError('Source transport checksum mismatch '+str(i))
              parts.append(b)
          data=b''.join(parts)
          if len(data)!=31534 or sha(data)!='efe948d56f0596ac9f9d428f66800376197f3a7d00b0fb77a3168f74bd26b555':
              raise RuntimeError('Complete source bundle checksum mismatch')
          raw=zlib.decompress(data)
          if len(raw)!=99186: raise RuntimeError('Unexpected expanded bundle length')
          spec=json.loads(raw)
          if spec['base']!=base or spec['tree']!=tree or len(spec['files'])!=27:
              raise RuntimeError('Source checkpoint identity mismatch')
          pending={}
          for row in spec['files']:
              path=row['path']; rel=PurePosixPath(path)
              if rel.is_absolute() or '..' in rel.parts or '\\' in path or rel.parts[0] not in ('src','tools','baseline','docs') or path in pending:
                  raise RuntimeError('Unsafe or duplicate source path')
              if 'copy' in row:
                  result=git('show',base+':'+row['copy'])
              elif 'content' in row:
                  if Path(path).exists(): raise RuntimeError('New source already exists: '+path)
                  result=row['content'].encode('utf-8')
              else:
                  old=Path(path).read_bytes()
                  if sha(old)!=row['base_sha256']: raise RuntimeError('Source changed since review: '+path)
                  lines=old.decode('utf-8').splitlines(keepends=True)
                  for i,j,replacement in reversed(row['edits']):
                      if not 0<=i<=j<=len(lines): raise RuntimeError('Invalid source edit range')
                      lines[i:j]=[replacement]
                  result=''.join(lines).encode('utf-8')
              if sha(result)!=row['sha256']: raise RuntimeError('Reconstructed file differs from review: '+path)
              pending[path]=result
          for path,result in pending.items():
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          for path in transport+[workflow]:Path(path).unlink()
          git('add','-A')
          if git('write-tree').decode().strip()!=tree: raise RuntimeError('Final source tree differs from reviewed local tree')
          git('diff','--cached','--check')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','Separate desktop navigation and text entry; modernize startup, trainers and inventory')
          checkpoint=git('rev-parse','HEAD').decode().strip()
          receipt={'checkpoint':checkpoint,'tree':tree,'base':base,'files':{p:sha(b) for p,b in pending.items()}}
          Path('build/source-checkpoint.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('checkpoint='+checkpoint+'\n')
          print('Exact source tree committed:',checkpoint,tree)
          PY
      - name: Restore verified libraries and real OpenGL test display
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-build-inputs.zip --dir "$RUNNER_TEMP"
          echo "5692696180a62dc1c8822e2a2d2a324f60647535a821865d7fb556e109b3883f  $RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokewilds-2.5d-build-inputs.zip" -d .
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Complete asset preparation, audited Java build and all 25 native runners
        run: |
          python tools/verify_rework.py --stage prepare
          python tools/verify_rework.py --stage build
          xvfb-run -a -s '-screen 0 2560x1440x24' python tools/verify_rework.py --stage native
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Publish only this fully verified source checkpoint without force push
        run: |
          git push origin HEAD:feat/desktop-interface-step3
          echo "Verified source checkpoint: $(git rev-parse HEAD)"
      - name: Restore only the pinned portable Windows runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.11-johto.2 --repo ZeriFox/pokewilds-2.5d --pattern pokewilds-2.5d-windows-x64.zip --dir "$RUNNER_TEMP"
          echo "7f21bb752c6eb5766a2a5f842cf6291e35123cb667ed588e553fda6d25133ae5  $RUNNER_TEMP/pokewilds-2.5d-windows-x64.zip" | sha256sum -c -
          python - <<'PY'
          import os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'pokewilds-2.5d-windows-x64.zip') as archive:
              prefix='pokewilds-2.5d/toolchain/jdk-17/'
              for member in archive.infolist():
                  if not member.filename.startswith(prefix) or member.is_dir():continue
                  relative=PurePosixPath(member.filename[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts or '\\' in str(relative) or ':' in str(relative):raise RuntimeError('Unsafe runtime entry')
                  path=Path('toolchain/jdk-17').joinpath(*relative.parts);path.parent.mkdir(parents=True,exist_ok=True)
                  with archive.open(member) as src,path.open('wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: Package the exact verified JAR for user testing, without a public release or tag
        run: python tools/package_windows.py --version v0.8.11-interface.1
      - name: Retain the compiled Windows candidate for the user and Windows verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-step3-playable
          path: build/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-step3-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/source-checkpoint.json
            build/transport-inputs/
            build/rework-verification/
            build/build-report.json
            build/visual-scope.json
            build/*/*.log
            build/*/*.png
            build/move-effects/**/*.png

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.checkpoint }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download the exact candidate from this run
        shell: pwsh
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo ZeriFox/pokewilds-2.5d --name ui-step3-playable --dir build/portable
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
      - name: Launch the extracted player with its bundled Windows Java
        shell: pwsh
        run: |
          python tools/verify_windows_package.py build/portable/pokewilds-2.5d-windows-x64-v0.8.11-interface.1.zip
          if ($LASTEXITCODE -ne 0) { throw 'Windows player verification failed' }
      - name: Retain Windows launcher and native rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-step3-windows-evidence
          if-no-files-found: warn
          retention-days: 7
          path: build/windows-package-verification/
